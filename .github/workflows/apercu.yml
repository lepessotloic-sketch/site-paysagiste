# Génère et publie l'aperçu d'un prospect qui en a fait la demande depuis le
# formulaire de essentiel.impact-nva.fr.
#
# Déclenché par n8n, qui appelle l'API GitHub :
#   POST /repos/lepessotloic-sketch/site-paysagiste/dispatches
#   { "event_type": "nouvel-apercu",
#     "client_payload": { "entreprise": "...", "ville": "...",
#                         "telephone": "...", "nom": "slug-code" } }
#
# C'est n8n qui tire le code du lien : il connaît ainsi l'adresse finale avant
# même que la page existe, et peut envoyer le SMS dès qu'elle répond.

name: Aperçu prospect

on:
  repository_dispatch:
    types: [nouvel-apercu]

# Deux demandes simultanées se pousseraient dessus : on les sérialise.
concurrency:
  group: apercu-prospect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Les valeurs viennent d'un formulaire public : elles passent par
      # l'environnement, jamais par interpolation dans le shell. Le script
      # les valide, borne leur longueur et échappe le HTML.
      - name: Générer l'aperçu
        env:
          ENTREPRISE: ${{ github.event.client_payload.entreprise }}
          VILLE: ${{ github.event.client_payload.ville }}
          TELEPHONE: ${{ github.event.client_payload.telephone }}
          NOM: ${{ github.event.client_payload.nom }}
          SORTIE: apercu
        run: node .apercu-modele/depuis-demande.js

      - name: Publier
        env:
          NOM: ${{ github.event.client_payload.nom }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apercu
          if git diff --staged --quiet; then
            echo "Rien de nouveau à publier."
            exit 0
          fi
          git commit -m "Aperçu prospect : $NOM"
          git push
          echo "En ligne : https://impact-nva.fr/apercu/$NOM/"
